name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Move Project Files
        run: |
          if [ -f "Jaan_Nurie_New_Game.zip" ]; then
            echo "Unzipping Jaan_Nurie_New_Game.zip..."
            unzip -o Jaan_Nurie_New_Game.zip
          fi
          
          if [ -d "Jaan_Nurie_New_Game" ]; then
            echo "Moving files from subfolder..."
            cp -r Jaan_Nurie_New_Game/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Fix Kotlin Dependency Resolution
        run: |
          # Inject strategy into root build.gradle to resolve stdlib conflicts
          if [ -f "build.gradle" ]; then
            echo "subprojects { configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.9.22' } } } }" >> build.gradle
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
